# Use postgres/example user/password credentials

services:

  api:
    image: wf-obs-api
    build: ./api
    depends_on:
      db:
        condition: service_started
    env_file:
      - ./.env
    networks:
      - gw-repo-network
    ports:
      - "80:80"

  db:
    image: postgres:18
    restart: always
    shm_size: 1024mb
    volumes:
      - gw-repo-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"  
    networks:
      - gw-repo-network

  streamlit:
    build:
      context: .
      dockerfile: ui/Dockerfile
    restart: always
    ports:
      - "8501:8501"
    env_file:
      - ./.env
    environment:
      - API_BASE_URL=http://api
    depends_on:
      - api
    networks:
      - gw-repo-network

networks:
  gw-repo-network:

volumes:
  gw-repo-db-data: